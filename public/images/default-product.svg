<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dny-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf9"/>
      <stop offset="50%" stop-color="#fcf6f4"/>
      <stop offset="100%" stop-color="#f8edeb"/>
    </linearGradient>
    <linearGradient id="dny-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f6"/>
      <stop offset="100%" stop-color="#fde4e8"/>
    </linearGradient>
    <linearGradient id="dny-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8be78"/>
      <stop offset="50%" stop-color="#d49b42"/>
      <stop offset="100%" stop-color="#b67c29"/>
    </linearGradient>
    <linearGradient id="dny-wine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#940923"/>
      <stop offset="100%" stop-color="#690617"/>
    </linearGradient>
    <filter id="dny-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#940923" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#dny-bg)"/>

  <!-- Subtle border frame -->
  <rect x="10" y="10" width="380" height="380" rx="12" fill="none" stroke="#eadde0" stroke-width="1.2" stroke-dasharray="4 2"/>

  <!-- Center Decorative Glow & Badge -->
  <g transform="translate(200, 175)" filter="url(#dny-shadow)">
    <!-- Outer Soft Circle -->
    <circle cx="0" cy="0" r="52" fill="url(#dny-badge)" stroke="#f5d0d6" stroke-width="1.5"/>

    <!-- Subtle inner ring -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#eed6da" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Elegant Cosmetic Jar Vector Icon -->
    <g transform="translate(0, 3) scale(1.15)">
      <!-- Jar Body -->
      <path d="M-18,-4 C-18,-4 -19,16 -14,20 C-9,24 9,24 14,20 C19,16 18,-4 18,-4 Z" fill="#ffffff" stroke="#940923" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Cream / Jar Fill Shade -->
      <path d="M-15,0 C-15,0 -16,14 -12,17 C-8,20 8,20 12,17 C16,14 15,0 15,0 Z" fill="#fcf2f4" opacity="0.9"/>
      <!-- Jar Neck / Rim -->
      <rect x="-19" y="-7" width="38" height="4" rx="1.5" fill="#fdfbf9" stroke="#940923" stroke-width="1.5"/>
      <!-- Jar Cap (Gold / Luxury) -->
      <rect x="-17" y="-17" width="34" height="9" rx="2" fill="url(#dny-gold)" stroke="#b67c29" stroke-width="1.2"/>
      <!-- Cap highlight -->
      <line x1="-14" y1="-13" x2="14" y2="-13" stroke="#fff3dc" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

      <!-- Sparkle 1 (Top Right) -->
      <path d="M22,-16 Q22,-10 27,-10 Q22,-10 22,-4 Q22,-10 17,-10 Q22,-10 22,-16 Z" fill="#dba94e"/>
      <!-- Sparkle 2 (Bottom Left) -->
      <path d="M-22,8 Q-22,12 -18,12 Q-22,12 -22,16 Q-22,12 -26,12 Q-22,12 -22,8 Z" fill="#dba94e" opacity="0.8"/>
    </g>
  </g>

  <!-- Typography: Subtitle Only -->
  <text x="200" y="265" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#75676a">FOTO BELUM TERSEDIA</text>

  <!-- Delicate accent line -->
  <line x1="160" y1="282" x2="240" y2="282" stroke="#eadde0" stroke-width="1.2" stroke-linecap="round"/>
</svg>
